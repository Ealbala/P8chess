<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Pocho Chess logo. Knight: cburnett chess piece (Colin M.L. Burnett, BSD/GPL/GFDL). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- The road to GM: a rising golden path -->
  <path d="M40 470 C 170 440, 250 420, 300 330 S 380 190, 400 150" fill="none" stroke="url(#gold)" stroke-width="22" stroke-linecap="round" opacity="0.9"/>
  <path d="M40 470 C 170 440, 250 420, 300 330 S 380 190, 400 150" fill="none" stroke="#15803d" stroke-width="4" stroke-dasharray="18 22" stroke-linecap="round" opacity="0.8"/>
  <!-- Crown at the end of the road -->
  <g transform="translate(345 52)">
    <path d="M8 78 L0 18 L30 44 L55 0 L80 44 L110 18 L102 78 Z" fill="url(#gold)" stroke="#92400e" stroke-width="6" stroke-linejoin="round"/>
    <rect x="6" y="80" width="98" height="16" rx="6" fill="url(#gold)" stroke="#92400e" stroke-width="6"/>
  </g>
  <!-- Knight -->
  <g transform="translate(44 70) scale(8.4)" stroke="#14532d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill-rule="evenodd">
    <path d="M 22,10 C 32.5,11 38.5,18 38,39 L 15,39 C 15,30 25,32.5 23,18" fill="#ffffff"/>
    <path d="M 24,18 C 24.38,20.91 18.45,25.37 16,27 C 13,29 13.18,31.34 11,31 C 9.958,30.06 12.41,27.96 11,28 C 10,28 11.19,29.23 10,30 C 9,30 5.997,31 6,26 C 6,24 12,14 12,14 C 12,14 13.89,12.1 14,10.5 C 13.27,9.506 13.5,8.5 13.5,7.5 C 14.5,6.5 16.5,10 16.5,10 L 18.5,10 C 18.5,10 19.28,8.008 21,7 C 22,7 22,10 22,10" fill="#ffffff"/>
    <rect x="12" y="39" width="29" height="4.2" rx="1.8" fill="#ffffff"/>
    <path d="M 9.5 25.5 A 0.5 0.5 0 1 1 8.5,25.5 A 0.5 0.5 0 1 1 9.5 25.5 z" fill="#14532d"/>
    <path d="M 15 15.5 A 0.5 1.5 0 1 1 14,15.5 A 0.5 1.5 0 1 1 15 15.5 z" transform="matrix(0.866,0.5,-0.5,0.866,9.693,-5.173)" fill="#14532d"/>
  </g>
</svg>
